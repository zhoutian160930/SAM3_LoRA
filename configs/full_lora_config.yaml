# SAM3 LoRA Training Configuration - Optimized for Fast Convergence on Small Datasets
# 核心策略：仅微调图像编码器注意力层，最大化有效学习信号，最小化过拟合风险

# Model settings
model:
  name: "/home/model/sam3_pth/sam3pt/sam3.pt"
  # name: "/home/model/work/SAM3_LoRA/weight_output/trans10k/weight_megred/sam3_lora_r16a32.pt"
  cache_dir: null

# LoRA settings
lora:
  rank: 16                   # 小数据集最优值，不要改
  alpha: 32                  # 保持2x rank，SAM3标准配置
  dropout: 0.2               # 增大到0.2，防止过拟合

  # ✅ 只保留图像编码器的注意力层！其他全部删掉！
  target_modules:
    - "qkv"                  # 图像编码器融合的Q/K/V投影（唯一最重要的层）
    - "proj"                 # 图像编码器注意力输出投影

  # ✅ 关键开关：只开启图像编码器，关闭所有其他模块！
  apply_to_vision_encoder: true    # ✅ 必须开启！这是让loss下降的关键
  apply_to_text_encoder: false     # ❌ 不需要
  apply_to_geometry_encoder: false # ❌ 不需要
  apply_to_detr_encoder: false     # ❌ 不需要
  apply_to_detr_decoder: false     # ❌ 绝对不要开
  apply_to_mask_decoder: false     # ❌ 绝对不要开

# Training settings
training:
  data_dir: "/home/model/work/SAM3_LoRA/dataset/长龙航空餐具/"
  batch_size: 8                # 单卡24GB完全足够，比2更快收敛
  num_workers: 0               # 加快数据加载，不要用0

  learning_rate: 1.5e-4        # ✅ 图像编码器LoRA的黄金学习率
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1e-8
  max_grad_norm: 1.0

  num_epochs: 25               # ✅ 小数据集足够了，再多只会过拟合
  warmup_steps: 30             # ✅ 大幅减少warmup，让模型尽快开始学习
  lr_scheduler: "cosine"

  logging_steps: 5
  eval_steps: 15               # ✅ 每15步验证一次，及时观察loss变化
  save_steps: 15
  save_total_limit: 3          # 只保留最好的3个checkpoint

  mixed_precision: "bf16"
  seed: 42
  gradient_accumulation_steps: 2  

  # ✅ 必须开启梯度检查点，节省显存
  gradient_checkpointing: true

output:
  output_dir: "/home/model/work/SAM3_LoRA/weight_output/长龙航空餐具/weight_lora_r16a32"
  logging_dir: "/home/model/work/SAM3_LoRA/weight_output/长龙航空餐具/weight_lora_r16a32/logs"
  save_lora_only: true
  push_to_hub: false
  hub_model_id: null

evaluation:
  metric: "iou"
  save_predictions: true       # 保存预测结果，方便分析问题
  compute_metrics_during_training: true
  # ✅ 必须开启早停，防止过拟合
  early_stopping:
    enable: true
    patience: 3                # 连续3次eval没有提升就停止
    threshold: 0.001           # 提升小于0.1%视为没有提升

hardware:
  device: "cuda"
  dataloader_pin_memory: true
  use_compile: false